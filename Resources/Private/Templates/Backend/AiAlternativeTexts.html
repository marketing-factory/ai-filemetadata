<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Module" />

<f:section name="Content">
    <f:be.pageRenderer
        includeCssFiles="{0: 'EXT:ai_filemetadata/Resources/Public/Css/Backend/Module.css'}"
        includeJavaScriptModules="{0: '@mfd/ai/filemetadata/backend/ai-alternative-texts.js'}"
    />
    <h1><f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.heading" /></h1>

    <div class="btn-group mb-3" role="group" aria-label="{f:translate(key: 'LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.filter.label')}">
        <a
            class="btn btn-default{f:if(condition: isGeneratedStatus, then: ' active')}"
            href="{be:moduleLink(route: 'ai_filemetadata', arguments: {id: selectedFolderIdentifier, filter: 'generated', page: requestedPage})}"
        >
            <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.filter.generated" />
        </a>
        <a
            class="btn btn-default{f:if(condition: isNeedsReviewStatus, then: ' active')}"
            href="{be:moduleLink(route: 'ai_filemetadata', arguments: {id: selectedFolderIdentifier, filter: 'needs_review', page: requestedPage})}"
        >
            <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.filter.needsReview" />
        </a>
        <a
            class="btn btn-default{f:if(condition: isMissingStatus, then: ' active')}"
            href="{be:moduleLink(route: 'ai_filemetadata', arguments: {id: selectedFolderIdentifier, filter: 'missing', page: requestedPage})}"
        >
            <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.filter.missing" />
        </a>
    </div>

    <p>
        <strong><f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.scope" />:</strong>
        <f:if condition="{isGlobalScope}">
            <f:then>
                <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.scope.global" />
            </f:then>
            <f:else>
                <f:if condition="{selectedFolder}">
                    {selectedFolder.storage.name}: {selectedFolder.identifier}
                    <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.scope.recursive" />
                </f:if>
            </f:else>
        </f:if>
    </p>

    <div class="card mb-3">
        <div class="card-body">
            <h2 class="h4"><f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.generate.heading" /></h2>
            <f:if condition="{isGlobalScope}">
                <f:then>
                    <p class="mb-0" role="status">
                        <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.generate.selectFolder" />
                    </p>
                </f:then>
                <f:else>
                    <f:if condition="{canGenerate}">
                        <f:then>
                            <form method="post" action="{be:moduleLink(route: 'ai_filemetadata.generate')}" data-ai-filemetadata-generation-form>
                                <input type="hidden" name="formToken" value="{generationToken}" />
                                <input type="hidden" name="id" value="{selectedFolderIdentifier}" />
                                <input type="hidden" name="filter" value="{status}" />
                                <input type="hidden" name="page" value="{requestedPage}" />
                                <p>
                                    <strong><f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.generate.scope" />:</strong>
                                    {selectedFolder.combinedIdentifier}
                                    <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.scope.recursive" />
                                </p>
                                <p>
                                    <strong><f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.generate.missingCount" />:</strong>
                                    {missingAltTextCount}
                                </p>
                                <f:if condition="{missingAltTextCount}">
                                    <f:else>
                                        <div class="alert alert-info" role="status">
                                            <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.generate.noneMissing" />
                                        </div>
                                    </f:else>
                                </f:if>
                                <div class="alert alert-info" role="status" hidden data-ai-filemetadata-generation-running>
                                    <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.generate.running" />
                                </div>
                                <div class="form-check mb-3">
                                    <input class="form-check-input" type="checkbox" id="ai-filemetadata-overwrite" name="overwrite" value="1" data-ai-filemetadata-generation-control />
                                    <label class="form-check-label" for="ai-filemetadata-overwrite">
                                        <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.generate.overwrite" />
                                    </label>
                                </div>
                                <f:if condition="{missingAltTextCount}">
                                    <f:then>
                                        <button
                                            type="submit"
                                            class="btn btn-primary"
                                            data-ai-filemetadata-generation-control
                                            data-ai-filemetadata-generation-submit
                                            data-loading-label="{f:translate(key: 'LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.generate.loading')}"
                                        >
                                            <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.generate.submit" />
                                        </button>
                                    </f:then>
                                    <f:else>
                                        <button type="submit" class="btn btn-primary" disabled>
                                            <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.generate.submit" />
                                        </button>
                                    </f:else>
                                </f:if>
                            </form>
                        </f:then>
                        <f:else>
                            <p class="mb-0" role="status">
                                <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.generate.unavailable" />
                            </p>
                        </f:else>
                    </f:if>
                </f:else>
            </f:if>
        </div>
    </div>

    <f:if condition="{scopeIsEligible}">
        <f:then>
            <f:if condition="{hasError}">
                <f:then>
                    <div class="alert alert-danger" role="alert">
                        <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.error" />
                    </div>
                </f:then>
                <f:else>
                    <f:if condition="{records}">
                        <f:then>
                            <div class="table-fit table-fit-wrap">
                                <table class="table table-striped table-hover ai-filemetadata-table">
                                    <colgroup>
                                        <col class="ai-filemetadata-column-image" />
                                        <col />
                                        <col class="ai-filemetadata-column-language" />
                                        <col class="ai-filemetadata-column-generated" />
                                        <col class="ai-filemetadata-column-actions" />
                                    </colgroup>
                                    <thead>
                                        <tr>
                                            <th scope="col"><f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.column.image" /></th>
                                            <th scope="col"><f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.column.alternative" /></th>
                                            <th scope="col"><f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.column.language" /></th>
                                            <th scope="col"><f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.column.generationDate" /></th>
                                            <th scope="col"><f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.column.actions" /></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <f:for each="{records}" as="record">
                                            <tr>
                                                <td>
                                                    <div class="ai-filemetadata-filename mb-2" title="{record.file.name}">{record.file.name}</div>
                                                    <f:image
                                                        image="{record.file}"
                                                        maxWidth="200"
                                                        maxHeight="200"
                                                        class="ai-filemetadata-thumbnail"
                                                        loading="lazy"
                                                        alt=""
                                                    />
                                                </td>
                                                <td class="text-break ai-filemetadata-alternative-cell">
                                                    <f:if condition="{record.canEdit}">
                                                        <f:then>
                                                            <form method="post" action="{be:moduleLink(route: 'ai_filemetadata.edit')}">
                                                                <input type="hidden" name="formToken" value="{record.editToken}" />
                                                                <input type="hidden" name="metadata" value="{record.metadataUid}" />
                                                                <input type="hidden" name="id" value="{selectedFolderIdentifier}" />
                                                                <input type="hidden" name="filter" value="{status}" />
                                                                <input type="hidden" name="page" value="{pagination.currentPage}" />
                                                                <label class="visually-hidden" for="ai-filemetadata-alternative-{record.metadataUid}">
                                                                    <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.column.alternative" />
                                                                </label>
                                                                <textarea
                                                                    id="ai-filemetadata-alternative-{record.metadataUid}"
                                                                    name="alternative"
                                                                    class="form-control mb-2 ai-filemetadata-alternative"
                                                                >{record.alternative}</textarea>
                                                                <button type="submit" class="btn btn-default btn-sm">
                                                                    <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.edit.save" />
                                                                </button>
                                                            </form>
                                                        </f:then>
                                                        <f:else>{record.alternative}</f:else>
                                                    </f:if>
                                                </td>
                                                <td>{record.language}</td>
                                                <td>
                                                    <f:if condition="{record.generationDate}">
                                                        <f:then><f:format.date format="{dateFormat} {timeFormat}">{record.generationDate}</f:format.date></f:then>
                                                    </f:if>
                                                </td>
                                                <td>
                                                    <div class="d-flex flex-column align-items-start gap-2">
                                                        <f:if condition="{record.generationDate}">
                                                            <f:then>
                                                                <f:if condition="{record.reviewed}">
                                                                    <f:then>
                                                                        <span class="text-muted">
                                                                            <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.review.reviewed" />
                                                                        </span>
                                                                    </f:then>
                                                                    <f:else>
                                                                        <f:if condition="{record.canReview}">
                                                                            <f:then>
                                                                                <form method="post" action="{be:moduleLink(route: 'ai_filemetadata.review')}">
                                                                                    <input type="hidden" name="formToken" value="{record.reviewToken}" />
                                                                                    <input type="hidden" name="metadata" value="{record.metadataUid}" />
                                                                                    <input type="hidden" name="id" value="{selectedFolderIdentifier}" />
                                                                                    <input type="hidden" name="filter" value="{status}" />
                                                                                    <input type="hidden" name="page" value="{pagination.currentPage}" />
                                                                                    <button type="submit" class="btn btn-default btn-sm">
                                                                                        <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.review.markReviewed" />
                                                                                    </button>
                                                                                </form>
                                                                            </f:then>
                                                                            <f:else>
                                                                                <span class="text-muted">
                                                                                    <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.review.needsReview" />
                                                                                </span>
                                                                            </f:else>
                                                                        </f:if>
                                                                    </f:else>
                                                                </f:if>
                                                            </f:then>
                                                        </f:if>
                                                        <f:if condition="{record.canEdit}">
                                                            <be:link.editRecord
                                                                uid="{record.metadataUid}"
                                                                table="sys_file_metadata"
                                                                returnUrl="{be:moduleLink(route: 'ai_filemetadata', arguments: {id: selectedFolderIdentifier, filter: status, page: pagination.currentPage})}"
                                                                class="btn btn-default btn-sm"
                                                                title="{f:translate(key: 'LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.edit.metadata')}"
                                                            >
                                                                <core:icon identifier="actions-open" size="small" />
                                                                <span class="visually-hidden"><f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.edit.metadata" /></span>
                                                            </be:link.editRecord>
                                                        </f:if>
                                                    </div>
                                                </td>
                                            </tr>
                                        </f:for>
                                    </tbody>
                                </table>
                            </div>
                            <f:if condition="{pagination.totalPages} > 1">
                                <nav aria-label="{f:translate(key: 'LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.pagination.label')}">
                                    <ul class="pagination">
                                        <li class="page-item{f:if(condition: pagination.previousPage, else: ' disabled')}">
                                            <f:if condition="{pagination.previousPage}">
                                                <f:then>
                                                    <a class="page-link" href="{be:moduleLink(route: 'ai_filemetadata', arguments: {id: selectedFolderIdentifier, filter: status, page: pagination.previousPage})}">
                                                        <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.pagination.previous" />
                                                    </a>
                                                </f:then>
                                                <f:else>
                                                    <span class="page-link"><f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.pagination.previous" /></span>
                                                </f:else>
                                            </f:if>
                                        </li>
                                        <li class="page-item disabled">
                                            <span class="page-link">
                                                <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.pagination.status" arguments="{0: pagination.currentPage, 1: pagination.totalPages}" />
                                            </span>
                                        </li>
                                        <li class="page-item{f:if(condition: pagination.nextPage, else: ' disabled')}">
                                            <f:if condition="{pagination.nextPage}">
                                                <f:then>
                                                    <a class="page-link" href="{be:moduleLink(route: 'ai_filemetadata', arguments: {id: selectedFolderIdentifier, filter: status, page: pagination.nextPage})}">
                                                        <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.pagination.next" />
                                                    </a>
                                                </f:then>
                                                <f:else>
                                                    <span class="page-link"><f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.pagination.next" /></span>
                                                </f:else>
                                            </f:if>
                                        </li>
                                    </ul>
                                </nav>
                            </f:if>
                        </f:then>
                        <f:else>
                            <div class="alert alert-info" role="status">
                                <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.empty" />
                            </div>
                        </f:else>
                    </f:if>
                </f:else>
            </f:if>
        </f:then>
        <f:else>
            <div class="alert alert-info" role="status">
                <f:translate key="LLL:EXT:ai_filemetadata/Resources/Private/Language/locallang_be.xlf:module.scope.ineligible" />
            </div>
        </f:else>
    </f:if>
</f:section>

</html>
