services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Mfd\Ai\FileMetadata\:
    resource: '../Classes/'

  Mfd\Ai\FileMetadata\Command\GenerateAltTextsCommand:
    tags:
      - name: console.command
        command: ai:generate-alt-texts
  Mfd\Ai\FileMetadata\EventListener\EnrichFileMetadataAfterCreation:
    tags:
      - name: event.listener
  Mfd\Ai\FileMetadata\Services\FalCursor: ~
  # DataHandler hooks are created via GeneralUtility::makeInstance(), which only uses DI for public services
  Mfd\Ai\FileMetadata\Hooks\ResetAltTextGenerationDateHook:
    public: true
